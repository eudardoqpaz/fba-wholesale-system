# ============================================
# Nginx Reverse Proxy for FBA System
# Place this in /etc/nginx/sites-available/fba-system
# ============================================
#
# Setup:
#   sudo cp nginx.conf /etc/nginx/sites-available/fba-system
#   sudo ln -s /etc/nginx/sites-available/fba-system /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#

server {
    listen 80;
    server_name your-domain.com;  # Change this to your domain or IP

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Max upload size (for CSV files)
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static files (optional - serve directly for better performance)
    location /static/ {
        alias /path/to/fba_system/static/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
